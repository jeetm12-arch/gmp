<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Something For You ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffd6e7, #fff1f7);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .card {
            background: rgba(255,255,255,0.85);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 500px;
            margin: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            animation: appear 1.5s ease;
        }

        h1 {
            color: #e75480;
        }

        p {
            color: #555;
            font-size: 18px;
            line-height: 1.7;
        }

        button {
            border: none;
            background: #9fd8a3;
            color: white;
            padding: 14px 25px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            transform: scale(1.05);
        }
      .highlight-green {
    color: #5f8f68;
    font-weight: 600;
}

.highlight-rose {
    color: #c75b7a;
    font-weight: 600;
}

.highlight-gold {
    color: #b58a32;
    font-weight: 600;
}
        .heart {
            position: absolute;
            font-size: 25px;
            animation: float 6s linear infinite;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            from {
                bottom: -50px;
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            to {
                bottom: 110%;
                opacity: 0;
            }
        }

        /* Mobile optimization */
@media (max-width: 600px) {

    .card {
        width: 88%;
        max-width: none;
        padding: 28px 22px;
        border-radius: 25px;
        box-sizing: border-box;
    }

    h1 {
        font-size: 26px;
        margin-bottom: 15px;
    }

    p {
        font-size: 17px;
        line-height: 1.6;
    }

    button {
        font-size: 16px;
        padding: 14px 26px;
    }

    #message {
        font-size: 17px;
        line-height: 1.6;
    }
}
    </style>
</head>

<body>

    <div class="heart" style="left:10%; animation-delay:1s;">❤️</div>
    <div class="heart" style="left:30%; animation-delay:3s;">💗</div>
    <div class="heart" style="left:70%; animation-delay:2s;">💕</div>
    <div class="heart" style="left:90%; animation-delay:4s;">❤️</div>

    <div class="card">

       <h1 id="greeting">Good Morning, Kiddo ☀️</h1>

<p id="intro">
    I know you have a test today, so here's a tiny reminder...
</p>

        <button onclick="showMessage()">
            Open me ❤️
        </button>

        <p id="message"></p>

    </div>

<script>
    function showMessage() {

        // Hide the button
        document.querySelector("button").style.display = "none";

        // Hide greeting and introduction
        document.getElementById("greeting").style.display = "none";
        document.getElementById("intro").style.display = "none";

        // Show the message
        const message = document.getElementById("message");

       message.innerHTML =
    "Today is your test day, so no unnecessary stress, OKAY? 🍀<br><br>" +
    "<span class='highlight-green'>So go in there with that quiet brilliance of yours and give it your best. 👑</span><br><br>" +
    "<span class='highlight-rose'>Just a little reminder before your day gets busy - whatever we are, whatever we call this... some things don't really need a name to be real. ❤️</span><br>" +
    "<span class='highlight-green'>I'm always going to be rooting for you. 🫶</span><br><br>" +
    "Now go make that test regret being assigned to you. 📝<br><br>" +
    "<span class='highlight-gold'>Good luck, kiddo. Go shine. 💛</span>";

        // Smooth appearance
        message.style.animation = "appear 1.5s ease";
    }
</script>

</body>
</html>
